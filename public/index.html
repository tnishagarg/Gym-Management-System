<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - The CLUSTER</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
  <div class="container">

    <div class="container-header">
      <div style="width:56px;height:56px;background:rgba(201,168,76,0.15);border:2px solid rgba(201,168,76,0.4);border-radius:14px;display:flex;align-items:center;justify-content:center;margin: 0 auto 14px;font-size:28px;color:#c9a84c;">
        <i class="ti ti-barbell"></i>
      </div>
      <h1>The Cluster</h1>
      <p class="subtitle">Admin panel — sign in to continue</p>
    </div>

    <div class="container-body">
      <form method="post" action="/login" id="loginForm">
        <label>Email address</label>
        <input type="email" name="email" placeholder="Enter email" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
        <button type="submit">
          <i class="ti ti-login" style="margin-right:6px;vertical-align:-2px;"></i>Sign in
        </button>
      </form>
    </div>

  </div>
</body>
</html>
